services:
  fastapi:
    build: ./backend/
    container_name: fastapi-nt
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
  db:
    image: postgres:18-alpine
    container_name: postgres-nt
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    env_file:
      - .env
  adminer:
    image: adminer:5
    container_name: adminer-nt
    ports:
      - 8080:8080
    depends_on:
      - db
volumes:
  postgres_data:
